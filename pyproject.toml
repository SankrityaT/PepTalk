[project]
name = "tacticbench"
version = "0.1.0"
description = "Blind backtest of tactical reasoning against historical halftime deficits"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "anthropic>=0.40",
    "neo4j>=6.2.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.3",
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "scikit-learn>=1.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Vision extras. Kept optional so the core install stays light: judges running
# the graph and API should not have to pull ~2GB of torch. Request it per run:
#   uv run --extra cv python -m tacticbench.analyse_video clip.mp4
cv = ["torch>=2.2", "torchvision>=0.17", "ultralytics>=8.3"]

# uv syncs a group named `dev` automatically, so `uv run pytest` uses the
# project environment. Declared only under optional-dependencies, pytest is
# not a project dependency at all, and `uv run pytest` falls back to running it
# as a standalone tool in an environment holding none of the project's
# packages: neo4j and cv2 go missing and five modules fail to import for a
# reason that reads like a code error.
[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tacticbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# So the suite runs from a fresh clone before `uv pip install -e .`. Without
# it, `uv run pytest` in an environment lacking pytest falls back to an
# ephemeral one that cannot see the package, and twelve modules fail to
# import for a reason that looks like a code error and is not.
pythonpath = ["src"]
